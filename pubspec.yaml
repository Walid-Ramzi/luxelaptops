name: luxelaptops
description: Premium high-end laptop storefront — clean architecture Flutter front-end.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2
  google_fonts: ^8.1.0
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - lib/assets/hero-workstation.jpg
    - lib/assets/hero-gaming.jpg
    - lib/assets/hero-ultrabook.jpg
    - lib/assets/product-axis.jpg
    - lib/assets/product-nimbus.jpg
    - lib/assets/product-vanguard.jpg
    - lib/assets/video-thermal.jpg
    - lib/assets/fonts/inter.ttf
    - lib/assets/fonts/JetBrainsMono.ttf
    - lib/assets/fonts/ArchivoBlack.ttf

  fonts:
    - family: inter
      fonts:
        - asset: lib/assets/fonts/inter.ttf
    - family: JetBrainsMono
      fonts:
        - asset: lib/assets/fonts/JetBrainsMono.ttf
    - family: ArchivoBlack
      fonts:
        - asset: lib/assets/fonts/ArchivoBlack.ttf
